name: Update README

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    
    

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject Environment Variables into Template
        run: |
          sed "s/{{ NETLIFY_HOST  }}/${{ env.NETLIFY_HOST  }}/g" README.template.md > README.md

      - name: Commit and Push Updated README
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: dynamically update README env variables [skip ci]" || echo "No changes to commit"
          git push
