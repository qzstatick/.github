name: Auto Comment on Issues

on:
  issues:
    types: [opened]

jobs:
  comment:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write

    steps:
      - name: Comment on new issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ISSUE_AUTOMATION_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = context.issue.number;
            const username = context.payload.issue.user.login;

            const comment = [
              `👋 Hey @${username} — thanks for opening an issue!`,
              `A maintainer will review it soon. If you can, please include steps to reproduce the problem or the expected behavior.`,
              `For project context, you can also review the [repository README](README.md).`,
              `We appreciate your help! 💖`
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: comment
            });
      - name: Create branch for new issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ISSUE_AUTOMATION_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = context.issue.number;
            const branchName = `issue-${issueNumber}`;
            const { owner, repo } = context.repo;
            const repositoryId = context.payload.repository.node_id;
            const issueId = context.payload.issue.node_id;

            const { data: repositoryData } = await github.rest.repos.get({ owner, repo });
            const defaultBranchName = repositoryData.default_branch || 'main';
            const { data: baseBranch } = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: defaultBranchName
            });

            try {
              await github.rest.git.getRef({
                owner,
                repo,
                ref: `heads/${branchName}`
              });
              core.info(`Branch ${branchName} already exists.`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/heads/${branchName}`,
                sha: baseBranch.commit.sha
              });
              core.info(`Created branch ${branchName} from ${defaultBranchName}.`);
            }

            try {
              await github.graphql(`
                mutation CreateLinkedBranch($input: CreateLinkedBranchInput!) {
                  createLinkedBranch(input: $input) {
                    linkedBranch {
                      id
                    }
                  }
                }
              `, {
                input: {
                  repositoryId,
                  issueId,
                  oid: baseBranch.commit.sha,
                  name: branchName
                }
              });
              core.info(`Linked branch ${branchName} to issue #${issueNumber}.`);
            } catch (error) {
              core.warning(`Unable to link branch to issue via GraphQL: ${error.message}`);
            }

            const branchUrl = `https://github.com/${owner}/${repo}/tree/${branchName}`;
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: `🔀 Branch for this issue: [${branchName}](${branchUrl})`
            });
