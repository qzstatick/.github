name: Auto Comment on Issues

on:
  issues:
    types: [opened]

jobs:
  comment:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Comment on new issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = context.issue.number;
            const username = context.payload.issue.user.login;

            async function createBranch(owner, repo, baseBranch, releaseBranchName) {
              const branch = await github.rest.repos.getBranch({
                  owner,
                  repo,
                  branch: baseBranch
              });
              const releaseBranch = await github.rest.git.createRef({
                  owner,
                  repo,
                  ref: `refs/heads/${releaseBranchName}`,
                  sha: branch.data.commit.sha
              });

              console.log(`Branch ${releaseBranchName} created successfully!`);
            };

            // Usage
            await createBranch(context.repo.owner, context.repo.repo, 'main', 'issue--' + issueNumber);